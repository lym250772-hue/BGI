<svg xmlns="http://www.w3.org/2000/svg" width="2276" height="1260" viewBox="0 0 2276 1260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FBFD"/>
      <stop offset="58%" stop-color="#F2F7FA"/>
      <stop offset="100%" stop-color="#EAF2F6"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D3343"/>
      <stop offset="100%" stop-color="#3F6B7D"/>
    </linearGradient>
    <filter id="shadow" x="-14%" y="-16%" width="128%" height="132%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173041" flood-opacity=".13"/>
    </filter>
    <marker id="arrowB" markerWidth="13" markerHeight="13" refX="10.5" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6.5 L1,12 Z" fill="#4C819A"/>
    </marker>
    <marker id="arrowG" markerWidth="13" markerHeight="13" refX="10.5" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6.5 L1,12 Z" fill="#2E8C6A"/>
    </marker>
    <marker id="arrowA" markerWidth="13" markerHeight="13" refX="10.5" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6.5 L1,12 Z" fill="#BE8525"/>
    </marker>
    <marker id="arrowR" markerWidth="13" markerHeight="13" refX="10.5" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6.5 L1,12 Z" fill="#C45C58"/>
    </marker>
    <style>
      .title{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;font-size:38px;font-weight:800;fill:#fff}
      .sub{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;font-size:17px;fill:#DCEBF2}
      .h1{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;font-size:22px;font-weight:800;fill:#203747}
      .h2{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;font-size:19px;font-weight:800;fill:#203747}
      .body{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;font-size:14.5px;fill:#2D4351}
      .small{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;font-size:13px;fill:#617481}
      .mono{font-family:"Cascadia Mono","Consolas",monospace;font-size:13px;font-weight:700;fill:#315A6E}
      .mono2{font-family:"Cascadia Mono","Consolas",monospace;font-size:12px;fill:#456779}
      .badge{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#fff}
      .panel{fill:#fff;stroke:#D2DFE7;stroke-width:1.35;rx:22;filter:url(#shadow)}
      .card{stroke-width:1.35;rx:15;filter:url(#shadow)}
      .blue{fill:#E5F3FA;stroke:#9FC6DB}
      .green{fill:#E7F7F1;stroke:#9AD4BE}
      .amber{fill:#FFF4E2;stroke:#E0BD77}
      .rose{fill:#FFF0EF;stroke:#E7A9A5}
      .plain{fill:#F9FCFD;stroke:#CBD9E2}
      .bus{fill:#EDF6FA;stroke:#9FC6DB;stroke-width:1.5;rx:18}
      .lineB{fill:none;stroke:#4C819A;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowB)}
      .lineG{fill:none;stroke:#2E8C6A;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowG)}
      .lineA{fill:none;stroke:#BE8525;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowA)}
      .lineR{fill:none;stroke:#C45C58;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowR)}
      .lineNo{fill:none;stroke:#4C819A;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .dash{fill:none;stroke:#879FAB;stroke-width:2.2;stroke-dasharray:7 7}
    </style>
  </defs>

  <rect width="2276" height="1260" fill="url(#bg)"/>
  <g opacity=".22">
    <path d="M0 80H2276M0 160H2276M0 240H2276M0 320H2276M0 400H2276M0 480H2276M0 560H2276M0 640H2276M0 720H2276M0 800H2276M0 880H2276M0 960H2276M0 1040H2276M0 1120H2276M0 1200H2276" stroke="#DDE8EE"/>
    <path d="M80 0V1260M160 0V1260M240 0V1260M320 0V1260M400 0V1260M480 0V1260M560 0V1260M640 0V1260M720 0V1260M800 0V1260M880 0V1260M960 0V1260M1040 0V1260M1120 0V1260M1200 0V1260M1280 0V1260M1360 0V1260M1440 0V1260M1520 0V1260M1600 0V1260M1680 0V1260M1760 0V1260M1840 0V1260M1920 0V1260M2000 0V1260M2080 0V1260M2160 0V1260" stroke="#DDE8EE"/>
  </g>

  <rect x="54" y="38" width="2168" height="106" rx="26" fill="url(#top)" filter="url(#shadow)"/>
  <text x="94" y="90" class="title">BGI 多源情报采集与结构化交付架构图</text>
  <text x="94" y="124" class="sub">覆盖内容平台、二手/众包、社交 IM 与 Persona 主动探测，统一沉淀为可清洗、可研判、可追溯的原始情报事实表。</text>
  <rect x="1846" y="66" width="296" height="44" rx="22" fill="#fff" opacity=".14"/>
  <text x="1886" y="95" class="sub">采集子系统 → 研判子系统</text>

  <!-- Entry -->
  <rect x="54" y="174" width="2168" height="114" class="panel"/>
  <text x="90" y="218" class="h1">01 任务入口与运行控制</text>
  <rect x="90" y="238" width="430" height="34" class="card blue"/>
  <text x="116" y="260" class="mono">main.py collect：7 平台在线采集</text>
  <rect x="555" y="238" width="430" height="34" class="card amber"/>
  <text x="581" y="260" class="mono">login_edge.py / login-xianyu：登录态准备</text>
  <rect x="1020" y="238" width="470" height="34" class="card green"/>
  <text x="1046" y="260" class="mono">import_partner_jsonl.py：离线 JSONL 入库兼容</text>
  <rect x="1525" y="238" width="470" height="34" class="card rose"/>
  <text x="1551" y="260" class="mono">main.py persona run：Persona 主动探测</text>

  <!-- Dispatcher strip -->
  <rect x="270" y="316" width="760" height="50" class="bus"/>
  <text x="320" y="347" class="h2">平台采集调度器：collectors.registry.get_collector(platform)</text>
  <rect x="1125" y="316" width="406" height="50" class="card green"/>
  <text x="1160" y="347" class="h2">离线映射：validate() / map_to_raw()</text>
  <rect x="1620" y="316" width="438" height="50" class="card rose"/>
  <text x="1655" y="347" class="h2">Persona Engine：LLM + SafetyGuard</text>

  <!-- Engines -->
  <rect x="54" y="392" width="2168" height="300" class="panel"/>
  <text x="90" y="437" class="h1">02 采集引擎与渠道矩阵</text>

  <rect x="90" y="466" width="494" height="184" class="card blue"/>
  <rect x="118" y="489" width="104" height="26" rx="13" fill="#4C819A"/>
  <text x="134" y="507" class="badge">HTTP API</text>
  <text x="118" y="544" class="h2">高吞吐内容平台</text>
  <text x="118" y="572" class="body">微博、知乎、贴吧搜索，速度约 3-10 条/秒。</text>
  <text x="118" y="602" class="mono2">weibo_api_spider.py：搜索 + 评论接口</text>
  <text x="118" y="626" class="mono2">zhihu_api_spider.py / tieba_api_spider.py</text>

  <rect x="620" y="466" width="560" height="184" class="card amber"/>
  <rect x="648" y="489" width="126" height="26" rx="13" fill="#BE8525"/>
  <text x="663" y="507" class="badge">Playwright v3</text>
  <text x="648" y="544" class="h2">动态页面与评论增强</text>
  <text x="648" y="572" class="body">小红书、抖音、闲鱼、贴吧回复，支持 SSR、DOM 兜底与响应拦截。</text>
  <text x="648" y="602" class="mono2">xiaohongshu_spider.py / douyin_spider.py / xianyu_spider.py</text>
  <text x="648" y="626" class="mono2">comment_collector.py：评论与回复增强</text>

  <rect x="1216" y="466" width="408" height="184" class="card green"/>
  <rect x="1244" y="489" width="146" height="26" rx="13" fill="#2E8C6A"/>
  <text x="1260" y="507" class="badge">WebSocket + API</text>
  <text x="1244" y="544" class="h2">社交 IM 情报</text>
  <text x="1244" y="572" class="body">QQ 群基于 NapCatQQ 与 OneBot 11。</text>
  <text x="1244" y="602" class="mono2">listen：实时监听；fetch：历史拉取</text>
  <text x="1244" y="626" class="mono2">both：先拉历史，再持续监听</text>

  <rect x="1660" y="466" width="502" height="184" class="card rose"/>
  <rect x="1688" y="489" width="116" height="26" rx="13" fill="#C45C58"/>
  <text x="1706" y="507" class="badge">Persona</text>
  <text x="1688" y="544" class="h2">主动式情报探测</text>
  <text x="1688" y="572" class="body">LLM 人物画像驱动对话，SafetyGuard 阻断不合规交互。</text>
  <text x="1688" y="602" class="mono2">persona/engine.py：对话编排</text>
  <text x="1688" y="626" class="mono2">persona/safety.py：进入/外出检查</text>

  <!-- Output bus -->
  <rect x="292" y="716" width="1692" height="48" class="bus"/>
  <text x="660" y="747" class="h2">结构化原始情报总线：IntelItem / im_to_intel() / Persona Conversation / Partner JSON</text>
  <text x="110" y="737" class="small">特殊链路</text>
  <path class="dash" d="M188 742 H276"/>
  <text x="110" y="758" class="small">贴吧：HTTP 搜索后再用 Playwright 提取回复</text>

  <!-- Contract -->
  <rect x="54" y="792" width="2168" height="224" class="panel"/>
  <text x="90" y="837" class="h1">03 统一结构化数据契约</text>

  <rect x="90" y="866" width="438" height="108" class="card plain"/>
  <text x="118" y="902" class="h2">平台解析对象</text>
  <text x="118" y="929" class="body">部分 Spider 或示例脚本先产出 ParsedItem。</text>
  <text x="118" y="954" class="mono2">ParsedItem → normalize() → IntelItem</text>

  <rect x="570" y="866" width="590" height="108" class="card green"/>
  <text x="598" y="902" class="h2">IntelItem：统一情报条目</text>
  <text x="598" y="929" class="mono2">platform / content_raw / source_url / author_uid / group_id</text>
  <text x="598" y="954" class="mono2">comments / tags / image_urls / video_cover_url / metadata</text>

  <rect x="1202" y="866" width="402" height="108" class="card blue"/>
  <text x="1230" y="902" class="h2">IMMessageItem</text>
  <text x="1230" y="929" class="body">QQ 群消息专用模型。</text>
  <text x="1230" y="954" class="mono2">IMMessageItem → im_to_intel() → IntelItem</text>

  <rect x="1646" y="866" width="516" height="108" class="card amber"/>
  <text x="1674" y="902" class="h2">落库字段映射</text>
  <text x="1674" y="929" class="mono2">source_platform / source_url / author_id / content_raw</text>
  <text x="1674" y="954" class="mono2">media_urls / metadata / raw_status</text>

  <!-- Quality -->
  <rect x="54" y="1044" width="2168" height="132" class="panel"/>
  <text x="90" y="1090" class="h1">04 增强、质控与结构化交付</text>

  <rect x="90" y="1116" width="416" height="38" class="card amber"/>
  <text x="118" y="1140" class="h2">评论增强</text>
  <text x="250" y="1140" class="small">响应拦截 / DOM 回复提取 / comments</text>

  <rect x="542" y="1116" width="426" height="38" class="card blue"/>
  <text x="570" y="1140" class="h2">反爬稳定性</text>
  <text x="724" y="1140" class="small">Cookie、UA、持久化浏览器、自然延迟</text>

  <rect x="1004" y="1116" width="406" height="38" class="card green"/>
  <text x="1032" y="1140" class="h2">字段校验</text>
  <text x="1164" y="1140" class="mono2">validate() / map_to_raw()</text>

  <rect x="1446" y="1116" width="426" height="38" class="card rose"/>
  <text x="1474" y="1140" class="h2">幂等入库</text>
  <text x="1606" y="1140" class="mono2">exists_in_db() / _is_duplicate()</text>

  <rect x="1908" y="1116" width="214" height="38" class="card plain"/>
  <text x="1936" y="1140" class="h2">可追溯</text>

  <!-- Final strip -->
  <rect x="230" y="1210" width="330" height="36" class="card plain"/>
  <text x="258" y="1233" class="mono">mysql.insert_raw()</text>
  <rect x="610" y="1210" width="376" height="36" class="card blue"/>
  <text x="638" y="1233" class="mono">ods_raw_intel / RAW_COLLECTED</text>
  <rect x="1036" y="1210" width="330" height="36" class="card green"/>
  <text x="1064" y="1233" class="mono">cleaner.pipeline</text>
  <rect x="1416" y="1210" width="520" height="36" class="card amber"/>
  <text x="1444" y="1233" class="mono">analyzer.state_machine：分类 / 实体 / 黑话 / 扩线 / 评分</text>

