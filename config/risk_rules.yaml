# BAGI 风险分类规则库 v1.0
# 每类风险包含: keywords (直接匹配), regex (正则模式), variants (拼音/谐音变体), combos (高危组合)

诈骗:
  keywords:
    - "代办贷款"
    - "代办信用卡"
    - "代办签证"
    - "无抵押贷"
    - "秒批贷"
    - "黑户贷"
    - "恭喜中奖"
    - "领取奖品"
  regex:
    - "代办.{0,5}(贷款|信用卡|签证)"
    - "(无抵押|秒批|黑户).{0,3}贷"
    - "(恭喜|中奖).{0,5}(领取|填写)"
  variants:
    - "daikuan"
    - "xinyongka"
    - "heimanh"
  combos:
    - ["贷款", "无抵押"]
    - ["信用卡", "代办"]
    - ["中奖", "手续费"]

引流:
  keywords:
    - "加微信看"
    - "加Q看"
    - "加薇信"
    - "菠菜"
    - "博彩"
    - "百家乐"
    - "真人视讯"
    - "私密视频"
    - "福利姬"
  regex:
    - "(加.{0,3}[Qq薇微信]).{0,5}(看|视频|私密|福利)"
    - "[Qq薇微信]{1,2}.*\\d{5,}"
    - "(菠菜|博彩|百家乐|真人视讯)"
  variants:
    - "bocai"
    - "baijiale"
    - "fuliji"
  combos:
    - ["微信", "看片"]
    - ["QQ", "福利"]
    - ["飞机", "群"]

作弊:
  keywords:
    - "刷播放量"
    - "刷点赞"
    - "刷粉丝"
    - "刷销量"
    - "薅羊毛"
    - "撸货"
    - "套券"
    - "新人券"
    - "外挂"
    - "辅助脚本"
    - "透视"
    - "自瞄"
  regex:
    - "(刷|提升).{0,3}(播放量|点赞|粉丝|销量|评论)"
    - "(薅羊毛|撸货|套券|新人券)"
    - "(外挂|辅助|脚本|透视|自瞄)"
  variants:
    - "haoyangmao"
    - "wai gua"
    - "fuzhu"
  combos:
    - ["刷", "播放量"]
    - ["外挂", "游戏"]
    - ["薅羊毛", "平台"]

账号黑产:
  keywords:
    - "出售账号"
    - "买卖账号"
    - "收号"
    - "接码"
    - "猫池"
    - "打码平台"
    - "撞库"
    - "扫号"
    - "洗号"
    - "盗号"
    - "养号"
    - "批发出号"
  regex:
    - "(出|卖|售|收).{0,4}(号|账号)"
    - "(接码|猫池|打码|验证码.{0,3}接收)"
    - "(撞库|扫号|洗号|盗号)"
  variants:
    - "jiema"
    - "maochi"
    - "zhuangku"
  combos:
    - ["账号", "出售"]
    - ["接码", "注册"]
    - ["批发出号", "微信"]

内容违规:
  keywords:
    - "裸聊"
    - "黄片"
    - "AV"
    - "色情"
    - "约炮"
    - "成人"
  regex:
    - "(裸|黄片|AV|色情|福利姬|约炮)"
  variants:
    - "se qing"
    - "huangpian"
    - "yuepao"
  combos:
    - ["色情", "直播"]
    - ["裸聊", "app"]

