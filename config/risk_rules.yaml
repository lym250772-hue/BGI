    - "信息买卖"
    - "社工库"
    - "料子"
    - "跑分通道"
    - "四方支付"
  regex:
    - "(接码平台|发卡平台|卡密|黑卡)"
    - "(出售|购买).{0,4}(数据|名单|信息)"
  variants:
    - "jiema"
    - "heika"
    - "paofen"
  combos:
    - ["跑分", "银行卡"]
    - ["接码", "注册"]
    - ["飞机", "通道"]
    - ["料子", "出售"]

